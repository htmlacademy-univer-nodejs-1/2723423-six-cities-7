services:
  db:
    image: mongodb/mongodb-community-server:8.0-ubi9-slim
    restart: unless-stopped
    container_name: six-cities_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - six-cities_data:/data/db

  db_ui:
    image: mongo-express:latest
    restart: unless-stopped
    container_name: six-cities_mongo_express
    depends_on:
      - db
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:8081:8081'

volumes:
  six-cities_data:
